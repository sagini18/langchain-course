[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nsagini", email = "nsagini@isa.ae" }
]
requires-python = ">=3.12"
dependencies = [
    "black>=26.10.1",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.3",
    "langchain-unstructured>=1.0.1",
    "langchainhub>=0.1.21",
    "python-dotenv>=1.2.4",
    "unstructured>=0.27.37",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
